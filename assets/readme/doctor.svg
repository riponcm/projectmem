<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="t d">
  <title id="t">pjm doctor checks your setup in one command</title>
  <desc id="d">Example output of pjm doctor: it finds a project with memory that is not registered yet, confirms every registered project still has its memory, flags a Cursor config still pinned to a single repo, confirms the installed version, and suggests pjm doctor --fix.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1422"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="359" rx="12" fill="url(#bg)" stroke="#1e293b"/>
  <path d="M12 0.5 H888 A11.5 11.5 0 0 1 899.5 12 V30 H0.5 V12 A11.5 11.5 0 0 1 12 0.5 Z" fill="#131b2c"/>
  <circle cx="20" cy="16" r="5.5" fill="#ff5f57"/>
  <circle cx="39" cy="16" r="5.5" fill="#febc2e"/>
  <circle cx="58" cy="16" r="5.5" fill="#28c840"/>
  <text x="450" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">pjm doctor checks your setup in one command</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#cbd5e1">
    <text x="24" y="60"><tspan fill="#10b981">$</tspan> <tspan fill="#f1f5f9">pjm doctor</tspan></text>
    <text x="24" y="86" fill="#f1f5f9" font-weight="700">projectmem 0.3.7 — checking your setup</text>
    <text x="40" y="114"><tspan fill="#f59e0b">⚠</tspan> 1 project(s) have memory but are not registered</text>
    <text x="66" y="134" fill="#94a3b8">~/Developer/old-repo</text>
    <text x="40" y="162"><tspan fill="#10b981">✓</tspan> Every registered project still has its memory</text>
    <text x="40" y="190"><tspan fill="#f59e0b">⚠</tspan> MCP client config(s) still pinned to a single repo</text>
    <text x="66" y="210" fill="#94a3b8">Cursor&#160;&#160;~/.cursor/mcp.json</text>
    <text x="66" y="230" fill="#94a3b8">Remove --root / cwd / PROJECTMEM_ROOT from the projectmem entry.</text>
    <text x="40" y="258"><tspan fill="#10b981">✓</tspan> Running 0.3.7</text>
    <text x="66" y="278" fill="#94a3b8">Check PyPI for a newer release:&#160;&#160;pjm doctor --online</text>
    <text x="66" y="298" fill="#94a3b8">(projectmem makes no network calls unless you ask.)</text>
    <text x="24" y="330" fill="#f1f5f9">Run <tspan fill="#60a5fa">pjm doctor --fix</tspan> to apply the fixes above.</text>
  </g>
</svg>
